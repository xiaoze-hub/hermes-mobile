name: hermes_mobile
description: "Cross-platform mobile client for Hermes Agent on Linux"
publish_to: 'none'
version: 1.1.1+3

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # 状态管理
  flutter_riverpod: ^2.5.1

  # 网络与 WebSocket 通信
  dio: ^5.4.1
  crypto: ^3.0.3
  web_socket_channel: ^2.4.5

  # 本地持久化与凭证安全存储
  flutter_secure_storage: ^9.0.0
  shared_preferences: ^2.2.2

  # Markdown 渲染与代码高亮
  flutter_markdown: ^0.6.20
  flutter_highlight: ^0.7.0

  # 工具库
  uuid: ^4.3.3
  intl: ^0.19.0
  cupertino_icons: ^1.0.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
