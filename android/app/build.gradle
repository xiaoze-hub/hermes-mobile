plugins {
    id "com.android.application"
    id "kotlin-android"
    // The Flutter Gradle Plugin must be applied after the Android and Kotlin Gradle plugins.
    id "dev.flutter.flutter-gradle-plugin"
}

def releaseKeyProperties = new Properties()
def releaseKeyPropertiesFile = rootProject.file("key.properties")
if (releaseKeyPropertiesFile.exists()) {
    releaseKeyProperties.load(new FileInputStream(releaseKeyPropertiesFile))
}

android {
    namespace = "com.example.hermes_mobile"
    compileSdk = flutter.compileSdkVersion
    ndkVersion = flutter.ndkVersion

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_1_8
        targetCompatibility = JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = JavaVersion.VERSION_1_8
    }

    defaultConfig {
        // TODO: Specify your own unique Application ID (https://developer.android.com/studio/build/application-id.html).
        applicationId = "com.example.hermes_mobile"
        // You can update the following values to match your application needs.
        // For more information, see: https://flutter.dev/to/review-gradle-config.
        minSdk = flutter.minSdkVersion
        targetSdk = flutter.targetSdkVersion
        versionCode = flutter.versionCode
        versionName = flutter.versionName
    }

    signingConfigs {
        if (releaseKeyPropertiesFile.exists()) {
            releaseUpload {
                keyAlias releaseKeyProperties["keyAlias"]
                keyPassword releaseKeyProperties["keyPassword"]
                storeFile rootProject.file(releaseKeyProperties["storeFile"])
                storePassword releaseKeyProperties["storePassword"]
            }
        }
    }

    buildTypes {
        release {
            signingConfig = releaseKeyPropertiesFile.exists()
                ? signingConfigs.releaseUpload
                : signingConfigs.debug
        }
    }
}

flutter {
    source = "../.."
}
