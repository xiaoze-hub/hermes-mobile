name: Publish Android update

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.24.x
          channel: stable
          cache: true
      - name: Configure signing key
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          test -n "$ANDROID_KEYSTORE_BASE64"
          mkdir -p android/signing
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/signing/release.jks
          cat > android/key.properties <<EOF
          storePassword=$ANDROID_KEYSTORE_PASSWORD
          keyPassword=$ANDROID_KEY_PASSWORD
          keyAlias=$ANDROID_KEY_ALIAS
          storeFile=signing/release.jks
          EOF
      - name: Install dependencies and build APK
        run: |
          flutter pub get
          flutter analyze || true
          flutter build apk --release
          cp build/app/outputs/flutter-apk/app-release.apk hermes-mobile.apk
      - name: Create update manifest
        env:
          TAG_NAME: ${{ github.ref_name }}
          REPOSITORY: ${{ github.repository }}
        run: |
          VERSION=$(sed -n 's/^version: *//p' pubspec.yaml | tr -d "'\"")
          VERSION_NAME=${VERSION%%+*}
          BUILD_NUMBER=${VERSION##*+}
          TAG_VERSION=${TAG_NAME#v}
          test "$VERSION_NAME" = "$TAG_VERSION"
          SHA256=$(sha256sum hermes-mobile.apk | cut -d ' ' -f 1)
          export VERSION_NAME BUILD_NUMBER SHA256 REPOSITORY
          python3 - <<'PY'
          import json, os
          data = {
              "version": os.environ["VERSION_NAME"],
              "buildNumber": int(os.environ["BUILD_NUMBER"]),
              "apkUrl": f"https://github.com/{os.environ['REPOSITORY']}/releases/latest/download/hermes-mobile.apk",
              "sha256": os.environ["SHA256"],
              "notes": "1. 桌面级多会话横向标签栏 (Session Tab Strip)：支持多任务会话水平并列与毫秒级即时切换。\n2. 桌面级工作区控制台 (Workspace Rails Drawer)：滑出式终端控制台、工作区文件目录树快速浏览与会话工件/Diff补丁收纳舱。\n3. 桌面级 Slash 命令快捷面板 ([/] Command Palette)：Docker/Top/Git/Cron/Subagent 9大快捷宏指令一键填装。\n4. 后台任务全景活动监视条、上下文透视芯片与多网关集群热切换全面增强。"
          }
          with open("update.json", "w", encoding="utf-8") as f:
              json.dump(data, f, ensure_ascii=False, indent=2)
          PY
      - name: Publish release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" hermes-mobile.apk update.json --title "Hermes Mobile ${{ github.ref_name }}" --generate-notes
      - name: Sync update.json to main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git remote set-url origin "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git"
          git fetch origin main
          git checkout main
          git pull origin main
          git add update.json
          git commit -m "chore(release): sync update.json for ${{ github.ref_name }} [skip ci]" || true
          git push origin main || true
