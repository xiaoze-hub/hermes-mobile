name: Publish Android update

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.24.x
          channel: stable
          cache: true
      - name: Configure signing key
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          test -n "$ANDROID_KEYSTORE_BASE64"
          mkdir -p android/signing
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/signing/release.jks
          cat > android/key.properties <<EOF
          storePassword=$ANDROID_KEYSTORE_PASSWORD
          keyPassword=$ANDROID_KEY_PASSWORD
          keyAlias=$ANDROID_KEY_ALIAS
          storeFile=signing/release.jks
          EOF
      - name: Install dependencies and build APK
        run: |
          flutter pub get
          flutter analyze > analyze.log 2>&1 || true
          cat analyze.log
          flutter build apk --release > build.log 2>&1 || {
            echo "## BUILD FAILED" >> $GITHUB_STEP_SUMMARY
            echo "### Flutter Analyze Log" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            cat analyze.log >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            echo "### Flutter Build APK Log" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            tail -n 100 build.log >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            cat build.log
            exit 1
          }
          cp build/app/outputs/flutter-apk/app-release.apk hermes-mobile.apk
      - name: Dump logs on failure
        if: failure()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -B ci-debug
          cp analyze.log ci_analyze.log 2>/dev/null || true
          tail -n 200 build.log > ci_build.log 2>/dev/null || true
          git add ci_analyze.log ci_build.log
          git commit -m "ci: debug failure logs [skip ci]" || true
          git push -f origin ci-debug || true
      - name: Create update manifest
        env:
          TAG_NAME: ${{ github.ref_name }}
          REPOSITORY: ${{ github.repository }}
        run: |
          VERSION=$(sed -n 's/^version: *//p' pubspec.yaml | tr -d "'\"")
          VERSION_NAME=${VERSION%%+*}
          BUILD_NUMBER=${VERSION##*+}
          TAG_VERSION=${TAG_NAME#v}
          test "$VERSION_NAME" = "$TAG_VERSION"
          SHA256=$(sha256sum hermes-mobile.apk | cut -d ' ' -f 1)
          export VERSION_NAME BUILD_NUMBER SHA256 REPOSITORY
          python3 - <<'PY'
          import json, os
          data = {
              "version": os.environ["VERSION_NAME"],
              "buildNumber": int(os.environ["BUILD_NUMBER"]),
              "apkUrl": f"https://github.com/{os.environ['REPOSITORY']}/releases/latest/download/hermes-mobile.apk",
              "sha256": os.environ["SHA256"],
              "notes": "Hermes Mobile 更新版本"
          }
          with open("update.json", "w", encoding="utf-8") as f:
              json.dump(data, f, ensure_ascii=False, indent=2)
          PY
      - name: Publish release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" hermes-mobile.apk update.json --title "Hermes Mobile ${{ github.ref_name }}" --generate-notes
