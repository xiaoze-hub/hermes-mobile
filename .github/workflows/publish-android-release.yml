name: Publish Android update

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.24.x
          channel: stable
          cache: true
      - name: Configure signing key
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          test -n "$ANDROID_KEYSTORE_BASE64"
          mkdir -p android/signing
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/signing/release.jks
          cat > android/key.properties <<EOF
          storePassword=$ANDROID_KEYSTORE_PASSWORD
          keyPassword=$ANDROID_KEY_PASSWORD
          keyAlias=$ANDROID_KEY_ALIAS
          storeFile=signing/release.jks
          EOF
      - name: Install dependencies and build APK
        run: |
          flutter pub get
          flutter analyze --no-fatal-infos > analyze.log 2>&1 || (cat analyze.log && cp analyze.log build_error.txt && exit 1)
          flutter build apk --release > build.log 2>&1 || (cat build.log | tail -n 80 && cp build.log build_error.txt && exit 1)
          cp build/app/outputs/flutter-apk/app-release.apk hermes-mobile.apk
      - name: Record error log on failure
        if: failure()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git remote set-url origin "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git"
          git fetch origin main
          git checkout main
          git pull origin main
          git add build_error.txt || true
          git commit -m "ci: capture build error [skip ci]" || true
          git push origin main || true
      - name: Create update manifest
        env:
          TAG_NAME: ${{ github.ref_name }}
          REPOSITORY: ${{ github.repository }}
        run: |
          VERSION=$(sed -n 's/^version: *//p' pubspec.yaml | tr -d "'\"")
          VERSION_NAME=${VERSION%%+*}
          BUILD_NUMBER=${VERSION##*+}
          TAG_VERSION=${TAG_NAME#v}
          test "$VERSION_NAME" = "$TAG_VERSION"
          SHA256=$(sha256sum hermes-mobile.apk | cut -d ' ' -f 1)
          export VERSION_NAME BUILD_NUMBER SHA256 REPOSITORY
          python3 - <<'PY'
          import json, os
          data = {
              "version": os.environ["VERSION_NAME"],
              "buildNumber": int(os.environ["BUILD_NUMBER"]),
              "apkUrl": f"https://github.com/{os.environ['REPOSITORY']}/releases/latest/download/hermes-mobile.apk",
              "sha256": os.environ["SHA256"],
              "notes": "1. 极致原生性能与体积瘦身：开启 R8 FullMode 编译优化、代码混淆与无用资源缩减 (shrinkResources)，显著降低包体积与内存占用。\n2. 全链路异步 I/O 与防 ANR：原生接入 Hermes-IO 专用守护线程池，文件读写与路径检测全面解耦主线程 Looper。\n3. Flutter 流式渲染与计算加速：大附件 base64 移至独立 Isolate (compute) 异步处理，消息列表接入 RepaintBoundary 帧级重绘隔离。\n4. 完备的系统级任务完成状态栏横幅、触觉震动与一键通道检测。"
          }
          with open("update.json", "w", encoding="utf-8") as f:
              json.dump(data, f, ensure_ascii=False, indent=2)
          PY
      - name: Publish release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "${{ github.ref_name }}" hermes-mobile.apk update.json --clobber || gh release create "${{ github.ref_name }}" hermes-mobile.apk update.json --title "Hermes Mobile ${{ github.ref_name }}" --generate-notes
      - name: Sync update.json to main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git remote set-url origin "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git"
          git fetch origin main
          git checkout main
          git pull origin main
          git add update.json
          git commit -m "chore(release): sync update.json for ${{ github.ref_name }} [skip ci]" || true
          git push origin main || true
