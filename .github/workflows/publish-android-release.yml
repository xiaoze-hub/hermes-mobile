name: Publish Android update

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.24.x
          channel: stable
          cache: true
      - name: Configure signing key
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          test -n "$ANDROID_KEYSTORE_BASE64"
          mkdir -p android/signing
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/signing/release.jks
          cat > android/key.properties <<EOF
          storePassword=$ANDROID_KEYSTORE_PASSWORD
          keyPassword=$ANDROID_KEY_PASSWORD
          keyAlias=$ANDROID_KEY_ALIAS
          storeFile=signing/release.jks
          EOF
      - name: Install dependencies and build APK
        run: |
          flutter pub get
          flutter analyze --no-fatal-infos > analyze.log 2>&1 || (cat analyze.log && cp analyze.log build_error.txt && exit 1)
          flutter build apk --release > build.log 2>&1 || (cat build.log | tail -n 80 && cp build.log build_error.txt && exit 1)
          cp build/app/outputs/flutter-apk/app-release.apk hermes-mobile.apk
      - name: Record error log on failure
        if: failure()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git remote set-url origin "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git"
          git fetch origin main
          git checkout main
          git pull origin main
          git add build_error.txt || true
          git commit -m "ci: capture build error [skip ci]" || true
          git push origin main || true
      - name: Create update manifest
        env:
          TAG_NAME: ${{ github.ref_name }}
          REPOSITORY: ${{ github.repository }}
        run: |
          VERSION=$(sed -n 's/^version: *//p' pubspec.yaml | tr -d "'\"")
          VERSION_NAME=${VERSION%%+*}
          BUILD_NUMBER=${VERSION##*+}
          TAG_VERSION=${TAG_NAME#v}
          test "$VERSION_NAME" = "$TAG_VERSION"
          SHA256=$(sha256sum hermes-mobile.apk | cut -d ' ' -f 1)
          export VERSION_NAME BUILD_NUMBER SHA256 REPOSITORY
          python3 - <<'PY'
          import json, os
          data = {
              "version": os.environ["VERSION_NAME"],
              "buildNumber": int(os.environ["BUILD_NUMBER"]),
              "apkUrl": f"https://github.com/{os.environ['REPOSITORY']}/releases/latest/download/hermes-mobile.apk",
              "sha256": os.environ["SHA256"],
              "notes": "1. 性能与流畅度跃升：流式输出 24ms 帧率缓冲防掉帧、ToolCard 惰性按需渲染、最近会话本地秒开缓存 (0ms 切换)。\n2. 交互体验升级：代码块顶部栏支持「语言标签 + 一键复制代码 + 下发终端执行」，支持「引用追问」、图片附件缩略图与全屏双指缩放预览、侧边栏左右滑动置顶/删除与下拉刷新。\n3. 视觉与细节打磨：新增 2×2 可交互场景启动卡片、微光骨架屏加载过渡、流式极光呼吸指示器与消息精致时间戳。"
          }
          with open("update.json", "w", encoding="utf-8") as f:
              json.dump(data, f, ensure_ascii=False, indent=2)
          PY
      - name: Publish release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "${{ github.ref_name }}" hermes-mobile.apk update.json --clobber || gh release create "${{ github.ref_name }}" hermes-mobile.apk update.json --title "Hermes Mobile ${{ github.ref_name }}" --generate-notes
      - name: Sync update.json to main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git remote set-url origin "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git"
          git fetch origin main
          git checkout main
          git pull origin main
          git add update.json
          git commit -m "chore(release): sync update.json for ${{ github.ref_name }} [skip ci]" || true
          git push origin main || true
